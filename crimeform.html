<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home | Cyber Crime Case Forms </title>
    <!-- Using Bootstrap 5 framework -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
     <style>
    </style>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery used to load the navbar -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <a class="visually-hidden-focusable" href="#main-content">Skip to main content</a>  
<div id="nav-placeholder"></div>

<div class="container py-5" style="max-width: 800px;">

<!-- Case form -->
    <section id="caseForm">
      <h2 class="text-center mb-3" id="caseFormTitle">Case Form</h2>
      <div class="text-center mb-4">
        <img src="images/desctive.jpg"alt= "Dective shdaow with a white background"  class="img-fluid" style="max-height: 200px;">
      </div>

 <form id="caseFormElement" novalidate>

<!-- Case Name -->
    <div class="mb-3">
          <label for="caseName" class="form-label">Case Name/Title</label>
          <input type="text" class="form-control" id="caseName">
          <div class="invalid-feedback"></div>
        </div>
<!-- Case ID -->
 <div class ="mb-3">
    <label for = "caseID" class ="form-label">Case ID</label>
    <input type ="text" class = "form-contorl" id="caseId">
    <div class="invalid-feedback"></div>
 </div>

 <!-- Classification -->
 <div class="mb-3">
    <label for="classifcation" class="form-label"> Classification</label>
      <select class="form-select" id="classification">
            <option value="">Choose...</option>
            <option>Hacking</option>
            <option>Malware</option>
            <option>Identity Theft</option>
            <option>Software Piracy</option>
            <option>Social Engineering</option>
            <option>Other</option>
          </select>
          <div class="invalid-feedback"></div>
          <div class="form-text">
              </div>
        </div>
     <div class="mb-3 d-none" id="otherBox">
          <label for="otherText" class="form-label">If other, please specify</label>
          <input type="text" class="form-control" id="otherText">
          <div class="invalid-feedback"></div>
        </div>

<!-- Serverity -->
    <div class="mb-3">
          <label for="severity" class="form-label">Severity</label>
          <select class="form-select" id="severity">
            <option value="">Choose...</option>
            <option>Low</option>
            <option>Medium</option>
            <option>High</option>
          </select>
          <div class="invalid-feedback"></div>
        </div>

<!-- Status -->
    <div class="mb-3">
          <label for="status" class="form-label">Status</label>
          <select class="form-select" id="status">
            <option value="">Choose...</option>
            <option>New</option>
            <option>Open</option>
            <option>Working</option>
            <option>Pending</option>
          </select>
          <div class="invalid-feedback"></div>
        </div>



 </div>

































<script>
        $(function () {
            $("#nav-placeholder").load("navbar.html");
        });
    </script>
</body>
</html>
